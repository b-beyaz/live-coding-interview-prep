name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Build Docker Image
        run: |
          docker build -t my-project:${{ github.sha }} .

      - name: Validate Helm Chart
        run: |
          helm lint ./newapp -f ./newapp/values-dev.yaml

      - name: Render Helm Templates
        run: |
          helm template my-project ./newapp -f ./newapp/values-dev.yaml --set image.tag=${{ github.sha }}
